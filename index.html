<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
}

/* =========================================
   HEADER
========================================= */

header {
    background: linear-gradient(135deg, #006093, #0087bd);
    color: white;
    padding: 20px 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,.2);
    position: relative;
    z-index: 2000;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 5px 0 0;
    opacity: .9;
}

.autores {
    margin-top: 8px;
    font-size: 13px;
    opacity: .85;
}

/* =========================================
   CONTENEDOR
========================================= */

.contenedor {
    display: flex;
    height: calc(100vh - 105px);
}

/* =========================================
   PANEL
========================================= */

aside {
    width: 400px;
    background: white;
    padding: 18px;
    overflow-y: auto;
    box-shadow: 3px 0 12px rgba(0,0,0,.12);
    z-index: 1000;
}

/* BUSCADOR */

.buscador {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 15px;
}

.buscador:focus {
    outline: none;
    border-color: #0087bd;
    box-shadow: 0 0 0 3px rgba(0,135,189,.12);
}

/* FILTROS */

.titulo-filtro {
    font-size: 11px;
    font-weight: bold;
    color: #777;
    margin: 15px 0 8px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.filtros button {
    border: 1px solid #ddd;
    background: white;
    padding: 8px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    transition: .2s;
}

.filtros button:hover {
    transform: translateY(-1px);
    background: #f1f3f5;
}

.filtros button.activo {
    background: #006093;
    color: white;
    border-color: #006093;
}

/* CONTADOR */

.contador {
    margin: 15px 0 10px;
    color: #777;
    font-size: 13px;
}

/* =========================================
   LISTA
========================================= */

.lista {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.lugar {
    border: 1px solid #e1e1e1;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: .2s;
    background: white;
}

.lugar:hover {
    transform: translateX(4px);
    box-shadow: 0 4px 12px rgba(0,0,0,.09);
}

.lugar-nombre {
    font-weight: bold;
    font-size: 14px;
    line-height: 1.3;
}

.lugar-info {
    font-size: 12px;
    color: #777;
    margin-top: 5px;
}

.badge {
    display: inline-block;
    margin-top: 7px;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: bold;
}

/* COLORES */

.naturaleza {
    background: #d8f3ef;
    color: #18766d;
}

.arqueologia {
    background: #fbd9dc;
    color: #b51f2b;
}

.productos {
    background: #ffedc9;
    color: #a86600;
}

.patrimonio {
    background: #dcecff;
    color: #0061a8;
}

.plazas {
    background: #dff2df;
    color: #318531;
}

/* =========================================
   MAPA
========================================= */

#mapa {
    flex: 1;
    height: 100%;
    background: #ddd;
}

/* =========================================
   MARCADORES
========================================= */

.emoji-marker {
    background: transparent !important;
    border: none !important;
}

.marker-emoji {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 3px solid white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    box-shadow:
        0 3px 9px rgba(0,0,0,.4);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;

    position: relative;
}

.marker-emoji:hover {
    transform: scale(1.25);

    box-shadow:
        0 6px 16px rgba(0,0,0,.45);

    z-index: 1000;
}

/* brillo */

.marker-emoji::after {

    content: "";

    position: absolute;

    top: 4px;
    left: 8px;

    width: 11px;
    height: 6px;

    background:
        rgba(255,255,255,.55);

    border-radius: 50%;

    transform: rotate(-25deg);
}

/* =========================================
   POPUP
========================================= */

.popup {
    width: 300px;
    max-width: 100%;
}

.popup h3 {
    margin: 0 0 8px;
    color: #006093;
    font-size: 18px;
    line-height: 1.3;
}

.popup-categoria {
    font-size: 11px;
    font-weight: bold;
    color: #777;
    margin-bottom: 12px;
}

.popup-seccion {

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid #e5e5e5;
}

.popup-seccion strong {

    display: block;

    color: #006093;

    margin-bottom: 5px;

    font-size: 13px;
}

.popup-seccion p {

    margin: 0;

    font-size: 13px;

    line-height: 1.5;

    color: #444;
}

.popup-ubicacion {

    background: #f3f5f7;

    padding: 8px;

    border-radius: 7px;

    font-size: 11px;

    color: #666;

    margin-top: 10px;
}

.coordenadas {

    font-size: 10px;

    color: #888;

    margin-top: 6px;
}

.boton-maps {

    display: block;

    text-align: center;

    background: #006093;

    color: white !important;

    padding: 10px;

    border-radius: 8px;

    text-decoration: none;

    margin-top: 12px;

    font-weight: bold;

    transition: .2s;
}

.boton-maps:hover {
    background: #004b73;
}

/* =========================================
   LEYENDA
========================================= */

.leyenda {

    background: white;

    padding: 12px 15px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);

    font-size: 12px;
}

.leyenda-titulo {
    font-weight: bold;
    margin-bottom: 8px;
}

.leyenda-item {

    display: flex;

    align-items: center;

    gap: 7px;

    margin: 5px 0;
}

.leyenda-emoji {

    width: 27px;
    height: 27px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 15px;
}

/* =========================================
   BOTÓN CENTRAR
========================================= */

.centrar {

    border: none;

    background: white;

    padding: 10px 13px;

    border-radius: 10px;

    cursor: pointer;

    box-shadow:
        0 3px 10px rgba(0,0,0,.25);

    font-weight: bold;
}

.centrar:hover {
    background: #f1f1f1;
}

/* =========================================
   MÓVIL
========================================= */

@media (max-width: 800px) {

    header h1 {
        font-size: 22px;
    }

    .contenedor {
        flex-direction: column;
        height: auto;
    }

    aside {
        width: 100%;
        height: 48vh;
        order: 2;
    }

    #mapa {
        height: 52vh;
        order: 1;
    }

}

</style>

/* ==========================================================

========================================================== */

const mapa = L.map("mapa").setView(
    [-31.7810127, -70.9658949],

);


/* MAPA ESRI */

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    }

).addTo(mapa);


/* ==========================================================
   CREAR ICONO
========================================================== */

function crearIcono(lugar) {

    return L.divIcon({

        className: "emoji-marker",

        html: `

            <div
                class="marker-emoji"
                style="
                    background:${lugar.color};
                "
            >
                ${lugar.emoji}
            </div>

        `,

        iconSize: [48,48],

        iconAnchor: [24,48],

        popupAnchor: [0,-45]

    });

}


/* ==========================================================
   MARCADORES
========================================================== */

const marcadores = [];


lugares.forEach(
    (lugar, indice) => {

        const marcador =
            L.marker(

                [
                    lugar.lat,
                    lugar.lng
                ],

                {
                    icon:
                        crearIcono(lugar)
                }

            );


        const urlMaps =

            "https://www.google.com/maps/dir/?api=1&destination="

            +

            lugar.lat

            +

            ","

            +

            lugar.lng;


        marcador.bindPopup(`

            <div class="popup">

                <h3>
                    ${lugar.emoji}
                    ${lugar.nombre}
                </h3>


                <div class="popup-categoria">

                    ${lugar.emoji}

                    ${lugar.categoria}

                    ·

                    ${lugar.valle}

                </div>


                <div class="popup-seccion">

                    <strong>
                        ℹ️ ¿Qué es?
                    </strong>

                    <p>
                        ${lugar.queEs}
                    </p>

                </div>


                <div class="popup-seccion">

                    <strong>
                        🎯 ¿Qué puedes hacer?
                    </strong>

                    <p>
                        ${lugar.hacer}
                    </p>

                </div>


                <div class="popup-ubicacion">

                    📍 ${lugar.ubicacion}

                </div>


                <div class="coordenadas">

                    Coordenadas:
                    ${lugar.lat},
                    ${lugar.lng}

                </div>


                <a
                    class="boton-maps"
                    href="${urlMaps}"
                    target="_blank"
                >

                    📍 Cómo llegar

                </a>

            </div>

        `);


        marcador.addTo(mapa);


        marcadores.push(
            marcador
        );

    }
);


/* ==========================================================
   FILTROS
========================================================== */

let categoriaActual = "Todos";

let valleActual = "Todos";


/* CLASE */

function obtenerClase(categoria) {

    return categoria

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* ==========================================================
   MOSTRAR LUGARES
========================================================== */

function mostrarLugares() {

    const lista =
        document.getElementById(
            "lista"
        );


    const contador =
        document.getElementById(
            "contador"
        );


    const busqueda =
        document
        .getElementById(
            "buscador"
        )
        .value
        .toLowerCase()
        .trim();


    lista.innerHTML = "";


    let cantidad = 0;


    lugares.forEach(
        (lugar, indice) => {


            const coincideCategoria =

                categoriaActual === "Todos"

                ||

                lugar.categoria ===
                categoriaActual;


            const coincideValle =

                valleActual === "Todos"

                ||

                lugar.valle ===
                valleActual;


            const coincideBusqueda =

                lugar.nombre
                .toLowerCase()
                .includes(busqueda)

                ||

                lugar.categoria
                .toLowerCase()
                .includes(busqueda)

                ||

                lugar.valle
                .toLowerCase()
                .includes(busqueda);


            const visible =

                coincideCategoria

                &&

                coincideValle

                &&

                coincideBusqueda;


            if (visible) {

                cantidad++;


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "lugar";


                const clase =
                    obtenerClase(
                        lugar.categoria
                    );


                item.innerHTML = `

                    <div class="lugar-nombre">

                        ${lugar.emoji}

                        ${lugar.nombre}

                    </div>


                    <div class="lugar-info">

                        📍 ${lugar.valle}

                    </div>


                    <span
                        class="badge ${clase}"
                    >

                        ${lugar.emoji}

                        ${lugar.categoria}

                    </span>

                `;


                item.addEventListener(
                    "click",
                    () => {

                        mapa.setView(

                            [
                                lugar.lat,
                                lugar.lng
                            ],

                            15

                        );


                        marcadores[
                            indice
                        ].openPopup();

                    }
                );


                lista.appendChild(
                    item
                );

            }


            if (visible) {

                if (
                    !mapa.hasLayer(
                        marcadores[indice]
                    )
                ) {

                    marcadores[
                        indice
                    ].addTo(mapa);

                }

            } else {

                if (
                    mapa.hasLayer(
                        marcadores[indice]
                    )
                ) {

                    mapa.removeLayer(
                        marcadores[indice]
                    );

                }

            }

        }
    );


    contador.textContent =

        cantidad +

        (

            cantidad === 1

            ?

            " atractivo encontrado"

            :

            " atractivos encontrados"

        );

}


/* ==========================================================
   FILTRO CATEGORÍA
========================================================== */

document
.querySelectorAll(
    "#filtrosCategoria button"
)
.forEach(
    boton => {

        boton.addEventListener(
            "click",
            () => {


                document
                .querySelectorAll(
                    "#filtrosCategoria button"
                )
                .forEach(
                    b =>
                        b.classList
                        .remove(
                            "activo"
                        )
                );


                boton.classList.add(
                    "activo"
                );


                categoriaActual =
                    boton.dataset.categoria;


                mostrarLugares();

            }
        );

    }
);

        );

);
